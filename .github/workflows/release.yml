name: Automated Binary Release

on:
  push:
    tags:
      - 'v*.*.*'

permissions:
  contents: write

jobs:
  release-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore

      - name: Run Test Suite
        run: dotnet test --configuration Release --no-restore --verbosity normal

      - name: Extract Tag Version
        id: get_version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          Write-Host "Releasing version: $tag"
          echo "VERSION=$tag" >> $env:GITHUB_OUTPUT

      - name: Publish Single-File Executable (win-x64)
        run: |
          dotnet publish src/SteamAchievementTracker.UI/SteamAchievementTracker.UI.csproj `
            -c Release `
            -r win-x64 `
            --self-contained true `
            -p:PublishSingleFile=true `
            -p:IncludeNativeLibrariesForSelfExtract=true `
            -p:EnableCompressionInSingleFile=true `
            -o dist/publish_win64

      - name: Package Release Assets
        shell: pwsh
        run: |
          $version = "${{ steps.get_version.outputs.VERSION }}"
          $zipName = "SteamAchievementTracker-$version-win-x64.zip"
          New-Item -ItemType Directory -Path "dist/release" -Force | Out-Null
          
          # Compress published binaries
          Compress-Archive -Path "dist/publish_win64/*" -DestinationPath "dist/release/$zipName"
          
          # Generate SHA256 checksum
          $hash = (Get-FileHash -Path "dist/release/$zipName" -Algorithm SHA256).Hash.ToLower()
          "$hash  $zipName" | Out-File -FilePath "dist/release/SHA256SUMS.txt" -Encoding utf8
          
          Write-Host "Generated release bundle: $zipName"
          Get-Content "dist/release/SHA256SUMS.txt"

      - name: Publish to GitHub Releases
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          files: |
            dist/release/*.zip
            dist/release/SHA256SUMS.txt
          generate_release_notes: true
          draft: false
          prerelease: false
